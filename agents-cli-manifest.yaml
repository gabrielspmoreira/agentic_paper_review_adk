name: agentic-paper-review
acli_version: 1.14.0
agent_directory: app
region: us-east1
base_template: adk_python
language: python
framework: google-adk
create_params:
  root_agent_name: academic_reviewer
  app_name: app
  deployment_target: agent_runtime
  session_type: agent_platform_sessions
  #session_type: in_memory
  cicd_runner: skip
  is_a2a: false
  agent_gateway: false
  agent_guidance_filename: GEMINI.md
  agent_runtime:
    identity_default: agent_identity    
    staging_bucket: "agentic-paper-review-staging"
  cloud_run:
    identity_default: agent_identity
